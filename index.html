<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="/src/assets/ticketstreamlogo.jpeg" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Search Engine Indexing & Robots -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    
    <!-- Primary SEO Meta Tags -->
    <title>Ticket Stream | Discover, Book & Manage Event Tickets Online</title>
    <meta name="title" content="Ticket Stream | Discover, Book & Manage Event Tickets Online" />
    <meta name="description" content="Discover upcoming events, buy tickets securely, and manage gate passes seamlessly on Ticket Stream." />
    <meta name="keywords" content="events, tickets, book tickets, concerts, parties, online ticketing, ticket management, Ticket Stream" />
    <link rel="canonical" href="https://ticketstream.gakenye-ndiritu.co.ke/" />

    <!-- Open Graph / Facebook Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ticketstream.gakenye-ndiritu.co.ke/" />
    <meta property="og:title" content="Ticket Stream | Discover, Book & Manage Event Tickets Online" />
    <meta property="og:description" content="Discover upcoming events, buy tickets securely, and manage gate passes seamlessly on Ticket Stream." />
    <meta property="og:image" content="https://ticketstream.gakenye-ndiritu.co.ke/ticketstreamlogo.jpeg" />

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ticketstream.gakenye-ndiritu.co.ke/" />
    <meta name="twitter:title" content="Ticket Stream | Discover, Book & Manage Event Tickets Online" />
    <meta name="twitter:description" content="Discover upcoming events, buy tickets securely, and manage gate passes seamlessly on Ticket Stream." />
    <meta name="twitter:image" content="https://ticketstream.gakenye-ndiritu.co.ke/ticketstreamlogo.jpeg" />

    <!-- Structured Data (JSON-LD) for Search Engines & AI Crawlers -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Ticket Stream",
        "url": "https://ticketstream.gakenye-ndiritu.co.ke/",
        "description": "Discover upcoming events, buy tickets securely, and manage gate passes seamlessly on Ticket Stream.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://ticketstream.gakenye-ndiritu.co.ke/events?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
